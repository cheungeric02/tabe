<style>
/* ============================ Material 3 Expressive tokens — persimmon (柿) ============================ */
:root{
  --primary:#3f5aa8; --on-primary:#ffffff; --primary-container:#dbe1ff; --on-primary-container:#00164f;
  --secondary:#4e8d6b; --secondary-container:#cdeed4; --on-secondary-container:#00210f;
  --tertiary:#6b5b92; --tertiary-container:#ebddff; --on-tertiary-container:#26005a;
  --surface:#fbf8ff; --surface-dim:#dad9e3;
  --sc-lowest:#ffffff; --sc-low:#f3f2fb; --sc:#edecf7; --sc-high:#e7e6f2; --sc-highest:#e1e0ed;
  --on-surface:#1a1b22; --on-surface-variant:#45464f; --outline:#767680; --outline-variant:#c7c5d0;
  --error:#ba1a1a; --error-container:#ffdad6; --on-error-container:#410002;
  --good:#2e7d43; --good-c:#cdeed4; --warn:#a8710a; --warn-c:#ffe0b2; --bad:#ba1a1a; --bad-c:#ffdad6;
  --shadow:0 1px 3px rgba(20,22,45,.12),0 1px 2px rgba(20,22,45,.08);
}
:root[data-theme="dark"]{
  --primary:#b4c4ff; --on-primary:#08286f; --primary-container:#26428f; --on-primary-container:#dbe1ff;
  --secondary:#b1d3b0; --secondary-container:#265034; --on-secondary-container:#cdeed4;
  --tertiary:#d6bbff; --tertiary-container:#524374; --on-tertiary-container:#ebddff;
  --surface:#121319; --surface-dim:#121319;
  --sc-lowest:#0d0e13; --sc-low:#1a1b22; --sc:#1e1f27; --sc-high:#292a32; --sc-highest:#33343d;
  --on-surface:#e3e1ec; --on-surface-variant:#c7c5d0; --outline:#90909a; --outline-variant:#45464f;
  --error:#ffb4ab; --error-container:#93000a; --on-error-container:#ffdad6;
  --good:#7fd48f; --good-c:#265034; --warn:#ffca7a; --warn-c:#4d3512; --bad:#ffb4ab; --bad-c:#93000a;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 1px 2px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--on-surface);font-family:'Segoe UI',Roboto,system-ui,-apple-system,sans-serif;font-size:15px;line-height:1.45;
  padding-bottom:calc(150px + env(safe-area-inset-bottom));overscroll-behavior-y:contain}
h1,h2,h3{margin:0;font-weight:650}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,select,textarea{font-family:inherit;font-size:15px}
.wrap{max-width:620px;margin:0 auto;padding:0 16px}
/* header */
header{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(12px);
  padding:calc(10px + env(safe-area-inset-top)) 0 8px}
.hrow{display:flex;align-items:center;gap:10px}
.brand{display:flex;align-items:center;gap:9px;font-size:20px;font-weight:750;letter-spacing:.2px}
.brand .k{font-size:23px;color:var(--primary)}
.spacer{flex:1}
.icon-btn{width:42px;height:42px;border-radius:999px;display:grid;place-items:center;font-size:19px;color:var(--on-surface-variant);position:relative}
.icon-btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:currentColor;opacity:0;transition:opacity .15s}
.icon-btn:active::after{opacity:.12}
/* date nav */
.datenav{display:flex;align-items:center;gap:6px;margin-top:8px}
.datenav .lbl{flex:1;text-align:center;font-weight:600;font-size:14.5px;color:var(--on-surface-variant)}
.chip{border:1px solid var(--outline-variant);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:600;color:var(--on-surface-variant);background:var(--sc-low)}
.chip.now{color:var(--primary);border-color:var(--primary)}
/* cards */
.card{background:var(--sc-low);border-radius:26px;padding:18px;margin:14px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none;background:var(--sc)}
.card h3{font-size:14px;text-transform:uppercase;letter-spacing:.6px;color:var(--on-surface-variant);margin-bottom:12px;font-weight:700}
/* hero ring */
.hero{background:var(--primary-container);color:var(--on-primary-container)}
.ringwrap{display:flex;align-items:center;gap:18px}
.ring{position:relative;width:150px;height:150px;flex:none}
.ring svg{transform:rotate(-90deg)}
.ring .mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .big{font-size:34px;font-weight:800;line-height:1}
.ring .cap{font-size:12px;font-weight:600;opacity:.8;margin-top:3px}
.heroinfo{flex:1;min-width:0}
.heroinfo .line{display:flex;justify-content:space-between;font-size:14px;padding:3px 0}
.heroinfo .line b{font-weight:700}
.pbar{height:12px;border-radius:999px;background:color-mix(in srgb,var(--on-primary-container) 15%,transparent);overflow:hidden;margin-top:4px}
.pbar>i{display:block;height:100%;border-radius:999px;background:var(--secondary);transition:width .4s}
.balchip{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:7px 13px;border-radius:999px;font-size:13px;font-weight:650;background:color-mix(in srgb,var(--on-primary-container) 10%,transparent)}
/* meals */
.meal{margin:10px 0}
.meal .mh{display:flex;align-items:center;gap:8px;margin:4px 2px}
.meal .mh .mt{font-weight:700;font-size:15px}
.meal .mh .mc{font-size:12.5px;color:var(--on-surface-variant)}
.meal .mh .add{margin-left:auto;color:var(--primary);font-weight:700;font-size:13px;padding:5px 12px;border-radius:999px;background:var(--sc)}
.entry{display:flex;align-items:center;gap:10px;padding:11px 12px;background:var(--sc-low);border-radius:16px;margin:6px 0}
.entry.fav-src{}
.entry .en{flex:1;min-width:0}
.entry .en .n{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.entry .en .s{font-size:12.5px;color:var(--on-surface-variant)}
.entry .cal{font-weight:750;font-size:15px}
.entry .x{color:var(--on-surface-variant);font-size:17px;width:30px;height:30px;border-radius:999px;display:grid;place-items:center;flex:none}
.entry .x:active{background:var(--error-container);color:var(--on-error-container)}
.entry .grip{flex:none;touch-action:none;cursor:grab;color:var(--outline);font-size:17px;width:22px;text-align:center;user-select:none;-webkit-user-select:none;line-height:1}
.entry .grip:active{cursor:grabbing}
.entry.dragging{opacity:.35}
.meal.droptarget{background:color-mix(in srgb,var(--primary-container) 55%,transparent);outline:2px dashed var(--primary);outline-offset:3px;border-radius:14px}
.dragghost{border-radius:16px!important;box-shadow:0 10px 28px rgba(0,0,0,.32);opacity:.95}
.empty{color:var(--on-surface-variant);font-size:13.5px;padding:8px 4px;font-style:italic}
.note{width:100%;border:1px solid var(--outline-variant);background:var(--sc-lowest);color:inherit;border-radius:16px;padding:12px;resize:vertical;min-height:52px;margin-top:6px}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:999px;font-weight:700;font-size:15px;background:var(--primary);color:var(--on-primary);position:relative;overflow:hidden}
.btn.tonal{background:var(--secondary-container);color:var(--on-secondary-container)}
.btn.outline{background:transparent;border:1px solid var(--outline);color:var(--primary)}
.btn.wide{width:100%}
.btn::after{content:"";position:absolute;inset:0;background:currentColor;opacity:0;transition:opacity .15s}
.btn:active::after{opacity:.14}
.btn:disabled{opacity:.5;pointer-events:none}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}
/* fields */
.field{margin:12px 0}
.field label{display:block;font-size:13px;font-weight:650;color:var(--on-surface-variant);margin-bottom:5px}
.inp{width:100%;border:1px solid var(--outline-variant);background:var(--sc-lowest);color:inherit;border-radius:14px;padding:13px 14px}
.inp:focus{outline:2px solid var(--primary);border-color:transparent}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.seg{display:flex;background:var(--sc);border-radius:999px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:999px;font-weight:650;font-size:13.5px;color:var(--on-surface-variant)}
.seg button.on{background:var(--primary);color:var(--on-primary)}
/* stats */
.statgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--sc);border-radius:20px;padding:15px}
.stat .v{font-size:26px;font-weight:800;line-height:1}
.stat .l{font-size:12.5px;color:var(--on-surface-variant);margin-top:4px}
.tdee{background:var(--tertiary-container);color:var(--on-tertiary-container)}
.tdee .v{font-size:32px}
/* weight */
.wbig{display:flex;align-items:baseline;gap:10px}
.wbig .v{font-size:44px;font-weight:850;line-height:1}
.wbig .u{font-size:18px;color:var(--on-surface-variant);font-weight:600}
.wsub{color:var(--on-surface-variant);font-size:14px;margin-top:6px}
.rate{font-weight:750}
.rate.down{color:var(--good)} .rate.up{color:var(--tertiary)}
/* heatmap */
.hm{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.hm .d{aspect-ratio:1;border-radius:8px;background:var(--sc);display:grid;place-items:center;font-size:11px;color:var(--on-surface-variant)}
.hm .d.under{background:var(--good-c);color:var(--good)}
.hm .d.over{background:var(--bad-c);color:var(--bad)}
.hm .d.none{opacity:.35}
.hm .d.today{outline:2px solid var(--primary)}
.hmhead{display:grid;grid-template-columns:repeat(7,1fr);gap:5px;margin-bottom:5px}
.hmhead span{text-align:center;font-size:11px;color:var(--on-surface-variant);font-weight:600}
/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:color-mix(in srgb,var(--sc-low) 94%,transparent);backdrop-filter:blur(14px);
  border-top:1px solid var(--outline-variant);display:flex;padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px;color:var(--on-surface-variant);font-size:11px;font-weight:600}
nav.tabs button .ni{width:56px;height:30px;border-radius:999px;display:grid;place-items:center;font-size:20px;transition:background .15s}
nav.tabs button.on{color:var(--on-surface)}
nav.tabs button.on .ni{background:var(--primary-container);color:var(--on-primary-container)}
/* FAB */
.fab{position:fixed;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:41;background:var(--primary);color:var(--on-primary);
  border-radius:20px;padding:15px 20px;font-weight:750;font-size:15px;display:flex;align-items:center;gap:9px;box-shadow:0 4px 14px rgba(120,50,20,.35)}
.fab:active{filter:brightness(.94)}
/* sheet / modal */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(20,10,5,.45);display:none;align-items:flex-end;justify-content:center}
.scrim.open{display:flex}
.sheet{background:var(--sc-low);width:100%;max-width:620px;border-radius:28px 28px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));
  max-height:90vh;overflow:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:translateY(0);opacity:1}}
.sheet .grab{width:36px;height:4px;border-radius:999px;background:var(--outline-variant);margin:0 auto 14px}
.sheet h2{font-size:19px;margin-bottom:4px}
.favrow{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;margin:0 -2px}
.favchip{flex:none;background:var(--secondary-container);color:var(--on-secondary-container);border-radius:14px;padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap;max-width:170px;overflow:hidden;text-overflow:ellipsis}
.checkrow{display:flex;align-items:center;gap:10px;margin:12px 2px;font-size:14px;font-weight:600;color:var(--on-surface-variant)}
.checkrow input{width:20px;height:20px;accent-color:var(--primary)}
/* snackbar */
.snack{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom));z-index:60;
  background:var(--sc-highest);color:var(--on-surface);border-radius:14px;padding:12px 16px;box-shadow:var(--shadow);display:none;align-items:center;gap:14px;font-size:14px;max-width:92vw}
.snack.show{display:flex}
.snack button{color:var(--primary);font-weight:750;padding:4px 6px}
/* scanner */
#scanView{position:relative;border-radius:20px;overflow:hidden;background:#000;aspect-ratio:4/3;margin:10px 0}
#scanView video{width:100%;height:100%;object-fit:cover}
.scanline{position:absolute;left:8%;right:8%;top:50%;height:2px;background:var(--primary);box-shadow:0 0 12px var(--primary)}
.status{font-size:13px;color:var(--on-surface-variant);margin:6px 2px;min-height:18px}
.status[data-state="err"]{color:var(--error)} .status[data-state="on"]{color:var(--good)}
.hide{display:none!important}
.tiny{font-size:12px;color:var(--on-surface-variant)}
.baklist{max-height:300px;overflow:auto}
.bakitem{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--outline-variant)}
.bakitem .bd{flex:1}
</style>
</head>
<body>

<header>
 <div class="wrap">
  <div class="hrow">
    <div class="brand"><svg class="mark" width="26" height="26" viewBox="0 0 26 26" aria-hidden="true">
      <circle cx="13" cy="13" r="10.5" fill="none" stroke="var(--primary)" stroke-width="3" stroke-linecap="round" stroke-dasharray="49 17" transform="rotate(-90 13 13)"/>
      <path d="M7.5 12.5a5.5 5.5 0 0 0 11 0z" fill="var(--primary)"/><rect x="7.5" y="11.2" width="11" height="1.9" rx="0.95" fill="var(--primary)"/>
    </svg><span>Tabe</span></div>

 </div>

<script>
/* ============================ Tabe — app logic ============================ */
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const MEALS=[["breakfast","Breakfast","🌅"],["lunch","Lunch","☀️"],["dinner","Dinner","🌙"],["snack","Snacks","🍎"]];
const todayStr=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d);};
const fmtD=s=>parseD(s).toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const daysBetween=(a,b)=>Math.round((parseD(b)-parseD(a))/86400000);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=(v,d=0)=>{const n=parseFloat(v);return isFinite(n)?n:d;};
const round=(n,p=0)=>{const f=10**p;return Math.round(n*f)/f;};

/* ---- default + state ---- */
function blank(){return{
  settings:{maintenance:2200,target:1800,protein:150,goalWeight:180,goalMode:"cut",unit:"lb",reminder:false},
  days:{},        // date -> {entries:[{id,name,cal,protein,meal,ts}], note:""}
  weights:{},     // date -> {w:Number, ts}
  favorites:[],   // {id,name,cal,protein,meal}
  updatedAt:0
};}
let S=blank();
let view="today";
let curDate=todayStr();
let undoTimer=null, undoData=null;

/* ---- persistence ---- */
function normalize(o){
  const b=blank(); if(!o||typeof o!=="object") return b;
  const s=Object.assign({},b.settings,o.settings||{});
  s.goalMode=["cut","maintain","bulk"].includes(s.goalMode)?s.goalMode:"cut";
  return{
    settings:s,
    days:(o.days&&typeof o.days==="object")?o.days:{},
    weights:(o.weights&&typeof o.weights==="object")?o.weights:{},
    favorites:Array.isArray(o.favorites)?o.favorites:[],
    updatedAt:o.updatedAt||0
  };
}
function save(bump=true){
  if(bump) S.updatedAt=Date.now();
  try{localStorage.setItem("tabe_state",JSON.stringify(S));}catch(e){}
  if(window.__tbCloud&&window.__tbCloud.connected) window.__tbCloud.push(S);
}
function load(){
  try{const raw=localStorage.getItem("tabe_state");if(raw)S=normalize(JSON.parse(raw));}catch(e){S=blank();}
}
window.__tbData=()=>S;
window.__tbApplyRemote=obj=>{
  const r=normalize(obj);
  if((r.updatedAt||0)>(S.updatedAt||0)){ S=r; try{localStorage.setItem("tabe_state",JSON.stringify(S));}catch(e){} render(); }
  else if((r.updatedAt||0)<(S.updatedAt||0)){ if(window.__tbCloud) window.__tbCloud.push(S); }
};

/* ---- day helpers ---- */
function day(d){ if(!S.days[d]) S.days[d]={entries:[],note:""}; if(!Array.isArray(S.days[d].entries)) S.days[d].entries=[]; return S.days[d]; }
const dayTotal=d=>(S.days[d]?.entries||[]).reduce((a,e)=>a+num(e.cal),0);
const dayProtein=d=>(S.days[d]?.entries||[]).reduce((a,e)=>a+num(e.protein),0);

/* ============================ Calorie logic ============================ */
function ringStatus(total,target,maint,mode){
  if(total<=0) return "none";
  if(mode==="cut"){ if(total<=target) return "good"; if(total<=maint) return "warn"; return "over"; }
  if(mode==="bulk"){ if(total>=target) return "good"; if(total>=maint) return "warn"; return "over"; }
  const lo=Math.min(target,maint), hi=Math.max(target,maint);
  if(total>=lo-120&&total<=hi+180) return "good";
  if(total>=lo-350&&total<=hi+420) return "warn"; return "over";
}
const statusColor=s=>({good:"var(--good)",warn:"var(--warn)",over:"var(--bad)",none:"color-mix(in srgb,var(--on-primary-container) 22%,transparent)"}[s]);

/* ============================ Weight logic ============================ */
function weighArr(){ return Object.keys(S.weights).sort().map(d=>({date:d,w:num(S.weights[d].w)})).filter(x=>x.w>0); }
function ema(arr,alpha=0.25){ let e=null; return arr.map(p=>{ e=e===null?p.w:alpha*p.w+(1-alpha)*e; return{date:p.date,w:e}; }); }
function regression(pts){ // pts:[{x,y}] -> slope,intercept
  const n=pts.length; if(n<2) return null;
  let sx=0,sy=0,sxx=0,sxy=0; pts.forEach(p=>{sx+=p.x;sy+=p.y;sxx+=p.x*p.x;sxy+=p.x*p.y;});
  const d=n*sxx-sx*sx; if(!d) return null;
  const slope=(n*sxy-sx*sy)/d; return{slope,intercept:(sy-slope*sx)/n};
}
function weightAnalysis(){
  const arr=weighArr(); if(!arr.length) return null;
  const tr=ema(arr); const latest=arr[arr.length-1]; const latestTrend=tr[tr.length-1].w;
  // regression over last 28 days of raw weigh-ins for rate
  const cut=addDays(todayStr(),-28);
  const recent=arr.filter(p=>p.date>=cut);
  let slopeWk=null;
  if(recent.length>=2){ const base=parseD(recent[0].date);
    const r=regression(recent.map(p=>({x:daysBetween(recent[0].date,p.date),y:p.w})));
    if(r) slopeWk=r.slope*7;
  }
  // eta to goal from trend
  const g=num(S.settings.goalWeight); let eta=null,etaDate=null,onTrack=false;
  if(g>0&&slopeWk!==null&&Math.abs(slopeWk)>0.02){
    const need=g-latestTrend; const perDay=slopeWk/7;
    if((need<0&&perDay<0)||(need>0&&perDay>0)){ eta=need/perDay; if(eta>0&&eta<3650){ etaDate=addDays(todayStr(),Math.round(eta)); onTrack=true; } }
  }
  const reached=g>0&&Math.abs(latestTrend-g)<0.5;
  return{arr,tr,latest,latestTrend,slopeWk,eta,etaDate,onTrack,goal:g,reached,start:arr[0]};
}

/* ============================ Actual TDEE from data ============================ */
function tdeeEstimate(){
  const arr=weighArr(); if(arr.length<2) return null;
  // window: last 28 days, need weigh-ins spanning >=10 days and food logged on >=60% of days
  const end=arr[arr.length-1], startCut=addDays(end.date,-28);
  const win=arr.filter(p=>p.date>=startCut); if(win.length<2) return null;
  const first=win[0]; const span=daysBetween(first.date,end.date); if(span<10) return null;
  // average intake over logged days within [first.date, end.date]
  let sum=0,logged=0;
  for(let d=first.date; d<=end.date; d=addDays(d,1)){ const t=dayTotal(d); if(t>0){sum+=t;logged++;} }
  const totalDays=span+1; if(logged<Math.ceil(totalDays*0.6)||logged<7) return null;
  const avgIntake=sum/logged;
  const deltaW=end.w-first.w;              // lb over span days
  const surplusPerDay=deltaW*3500/span;    // + means surplus
  const estMaint=avgIntake-surplusPerDay;
  return{estMaint:Math.round(estMaint),avgIntake:Math.round(avgIntake),deltaW:round(deltaW,1),span,logged};
}

/* ---- drag a food entry to a different meal (touch + mouse) ---- */
let dragState=null;
function beginDrag(ev){
  const handle=ev.currentTarget, id=handle.dataset.drag, entry=handle.closest(".entry");
  if(!entry) return;
  ev.preventDefault();
  const rect=entry.getBoundingClientRect();
  const ghost=entry.cloneNode(true); ghost.classList.add("dragghost");
  ghost.style.cssText+=`;position:fixed;left:${rect.left}px;top:${rect.top}px;width:${rect.width}px;margin:0;z-index:100;pointer-events:none`;
  document.body.appendChild(ghost);
  entry.classList.add("dragging");
  dragState={id,ghost,entry,offX:ev.clientX-rect.left,offY:ev.clientY-rect.top,curMeal:null};
  try{handle.setPointerCapture(ev.pointerId);}catch(e){}
  handle.addEventListener("pointermove",moveDrag);
  handle.addEventListener("pointerup",endDrag);
  handle.addEventListener("pointercancel",endDrag);
}
function moveDrag(ev){
  if(!dragState) return; ev.preventDefault();
  dragState.ghost.style.left=(ev.clientX-dragState.offX)+"px";
  dragState.ghost.style.top=(ev.clientY-dragState.offY)+"px";
  dragState.ghost.style.display="none";
  const el=document.elementFromPoint(ev.clientX,ev.clientY);
  dragState.ghost.style.display="";
  const meal=el&&el.closest?el.closest("[data-meal-drop]"):null;
  const key=meal?meal.dataset.mealDrop:null;
  if(key!==dragState.curMeal){
    $$("[data-meal-drop]").forEach(m=>m.classList.toggle("droptarget",m.dataset.mealDrop===key&&key!==null));
    dragState.curMeal=key;
  }
}
function endDrag(ev){
  if(!dragState) return;
  const {id,ghost,entry,curMeal}=dragState, handle=ev.currentTarget;
  ghost.remove(); entry.classList.remove("dragging");
  $$("[data-meal-drop]").forEach(m=>m.classList.remove("droptarget"));
  handle.removeEventListener("pointermove",moveDrag);
  handle.removeEventListener("pointerup",endDrag);
  handle.removeEventListener("pointercancel",endDrag);
  dragState=null;
  if(curMeal){ const d=day(curDate), it=d.entries.find(e=>e.id===id);
    if(it&&it.meal!==curMeal){ it.meal=curMeal; save(); renderToday(); toast("Moved to "+(MEALS.find(m=>m[0]===curMeal)?.[1]||curMeal)); } }
}

function drawChart(rangeDays){
  const box=$("#chart"); if(!box) return;
  let arr=weighArr(); if(rangeDays>0){ const cut=addDays(todayStr(),-rangeDays); arr=arr.filter(p=>p.date>=cut); }
  if(arr.length<1){ box.innerHTML=`<div class="empty">Not enough data</div>`; return; }
  const tr=ema(arr);
  const W=560,H=200,pl=38,pr=12,pt=14,pb=24;
  const xs=arr.map(p=>parseD(p.date).getTime());
  const minX=Math.min(...xs),maxX=Math.max(...xs)||minX+1;
  let vals=arr.map(p=>p.w).concat(tr.map(p=>p.w)); const g=num(S.settings.goalWeight);
  if(g>0) vals.push(g);
  let minY=Math.min(...vals),maxY=Math.max(...vals); if(minY===maxY){minY-=1;maxY+=1;} const padY=(maxY-minY)*0.12; minY-=padY;maxY+=padY;
  const X=t=>pl+((t-minX)/(maxX-minX||1))*(W-pl-pr);
  const Y=v=>pt+(1-(v-minY)/(maxY-minY||1))*(H-pt-pb);
  const line=pts=>pts.map((p,i)=>(i?"L":"M")+X(parseD(p.date).getTime()).toFixed(1)+" "+Y(p.w).toFixed(1)).join(" ");
  let svg=`<svg viewBox="0 0 ${W} ${H}" width="100%" preserveAspectRatio="none" style="display:block">`;
  // grid y labels
  for(let i=0;i<=3;i++){ const v=minY+(maxY-minY)*i/3; const y=Y(v);
    svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--outline-variant)" stroke-width="1" opacity=".5"/>
      <text x="4" y="${y+4}" font-size="11" fill="var(--on-surface-variant)">${round(v,0)}</text>`; }
  if(g>0){ const y=Y(g); svg+=`<line x1="${pl}" y1="${y}" x2="${W-pr}" y2="${y}" stroke="var(--primary)" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="${W-pr}" y="${y-4}" font-size="10" fill="var(--primary)" text-anchor="end">goal ${g}</text>`; }
  // actual faint line + dots
  svg+=`<path d="${line(arr)}" fill="none" stroke="var(--outline)" stroke-width="1.3" opacity=".45"/>`;
  svg+=`<path d="${line(tr)}" fill="none" stroke="var(--tertiary)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
  arr.forEach(p=>{ svg+=`<circle cx="${X(parseD(p.date).getTime()).toFixed(1)}" cy="${Y(p.w).toFixed(1)}" r="2.6" fill="var(--on-surface-variant)"/>`; });
  svg+=`</svg>`;
  box.innerHTML=svg+`<div style="display:flex;justify-content:space-between" class="tiny"><span>${fmtD(arr[0].date)}</span><span>trend ▬ &nbsp; actual •</span><span>${fmtD(arr[arr.length-1].date)}</span></div>`;
}

/* ---------- STATS ---------- */
function renderStats(){
  const t=tdeeEstimate();
  const st=S.settings;
  // streak: consecutive days up to today with any food logged
  let streak=0; for(let d=todayStr();;d=addDays(d,-1)){ if(dayTotal(d)>0)streak++; else break; if(streak>999)break; }
  // days under target in last 30 (cut) / near (else) among logged days
  let logged=0,good=0;
  for(let i=0;i<30;i++){ const d=addDays(todayStr(),-i); const tot=dayTotal(d); if(tot>0){logged++; if(ringStatus(tot,st.target,st.maintenance,st.goalMode)==="good")good++;} }
  // weekly energy balance over last 7 logged days
  let wsum=0,wdays=0; for(let i=0;i<7;i++){ const d=addDays(todayStr(),-i); const tot=dayTotal(d); if(tot>0){wsum+=(tot-st.maintenance);wdays++;} }
  const perWkLb=wdays?round((wsum/wdays)*7/3500,2):null;

  let h="";
  h+=`<div class="card tdee"><h3 style="color:inherit;opacity:.8">Your actual maintenance (from data)</h3>`;
  if(t){ const diff=t.estMaint-st.maintenance;
    h+=`<div class="v">${t.estMaint} <span style="font-size:15px;font-weight:600">kcal/day</span></div>
      <div class="wsub" style="color:inherit;opacity:.85">Based on ${t.logged} logged days & ${t.deltaW>0?"+":""}${t.deltaW} lb over ${t.span} days.<br>
      You entered <b>${st.maintenance}</b> — data says <b>${diff>0?"+":""}${diff}</b> ${Math.abs(diff)<75?"(spot on ✓)":diff>0?"higher":"lower"}.</div>
      ${Math.abs(diff)>=100?`<button class="btn tonal" id="applyTdee" style="margin-top:12px">Use ${t.estMaint} as maintenance</button>`:""}`;
  }else{
    h+=`<div class="wsub" style="color:inherit;opacity:.85">Log food most days and weigh in regularly for ~2 weeks. Once there's enough history, Tabe estimates your real maintenance from how your weight actually moves.</div>`;
  }
  h+=`</div>`;

  h+=`<div class="statgrid">
    <div class="stat"><div class="v">${streak}🔥</div><div class="l">Logging streak (days)</div></div>
    <div class="stat"><div class="v">${good}<span style="font-size:15px">/${logged}</span></div><div class="l">On-target days (30d logged)</div></div>
    <div class="stat"><div class="v">${perWkLb==null?"—":(perWkLb>0?"+":"")+perWkLb}</div><div class="l">Projected lb/wk (from intake)</div></div>
    <div class="stat"><div class="v">${logged?Math.round([...Array(30)].reduce((a,_,i)=>{const tot=dayTotal(addDays(todayStr(),-i));return tot>0?a+tot:a;},0)/logged):"—"}</div><div class="l">Avg intake (logged, 30d)</div></div>
  </div>`;

  // heatmap current month
  h+=`<div class="card"><h3>This month</h3>${heatmap()}</div>`;

  h+=`<div class="card flat"><h3>Data</h3><div class="btnrow">
    <button class="btn outline" id="expFood">⬇︎ Export food CSV</button>
    <button class="btn outline" id="expWeight">⬇︎ Export weight CSV</button>
    <button class="btn tonal" id="openBackups">🛟 Backups & restore</button>
  </div></div>`;

  $("#main").innerHTML=h;
  const at=$("#applyTdee"); if(at) at.onclick=()=>{ S.settings.maintenance=t.estMaint; save(); toast("Maintenance updated to "+t.estMaint); render(); };
  $("#expFood").onclick=exportFood; $("#expWeight").onclick=exportWeight; $("#openBackups").onclick=openBackups;
}
function heatmap(){
  const now=new Date(), y=now.getFullYear(), m=now.getMonth();
  const first=new Date(y,m,1), start=first.getDay(), dim=new Date(y,m+1,0).getDate();
  const st=S.settings;
  let h=`<div class="hmhead">`+["S","M","T","W","T","F","S"].map(x=>`<span>${x}</span>`).join("")+`</div><div class="hm">`;
  for(let i=0;i<start;i++) h+=`<div class="d none"></div>`;
  for(let dnum=1;dnum<=dim;dnum++){
    const ds=y+"-"+String(m+1).padStart(2,"0")+"-"+String(dnum).padStart(2,"0");
    const tot=dayTotal(ds); let cls="none";
    if(tot>0) cls=ringStatus(tot,st.target,st.maintenance,st.goalMode)==="good"?"under":"over";
    if(ds===todayStr()) cls+=" today";
    h+=`<div class="d ${cls}" title="${ds}${tot>0?': '+Math.round(tot)+' kcal':''}">${dnum}</div>`;
  }
  return h+`</div>`;
}

      <div class="field"><label>Protein (g)</label><input class="inp" type="number" inputmode="decimal" id="fProt" placeholder="0" value="${p.protein!=null?p.protein:""}"></div>
    </div>
    <div class="checkrow"><input type="checkbox" id="fFav"><label for="fFav" style="margin:0">Save as favorite</label></div>
    <div class="btnrow" style="margin-top:6px"><button class="btn wide" id="fSave">Add</button></div>`;
  openScrim();
  $$("[data-fav]").forEach(b=>b.onclick=()=>{ const f=S.favorites.find(x=>x.id===b.dataset.fav); if(f) logFood(meal,{name:f.name,cal:f.cal,protein:f.protein}); closeScrim(); });
  $("#scanBtn").onclick=()=>startScan(meal);
  $("#fSave").onclick=()=>{
    const name=$("#fName").value.trim(), cal=num($("#fCal").value), prot=num($("#fProt").value);
    if(!cal&&!name){ toast("Enter calories"); return; }
    logFood(meal,{name:name||"Food",cal,protein:prot});
    if($("#fFav").checked&&name) addFav({name,cal,protein:prot,meal});
    closeScrim();
  };
}
function logFood(meal,o){ const d=day(curDate); d.entries.push({id:uid(),name:o.name||"Food",cal:num(o.cal),protein:num(o.protein),meal,ts:Date.now()}); save(); if(view==="today")renderToday(); else render(); toast("Logged"); }
function addFav(o){ if(S.favorites.some(f=>f.name.toLowerCase()===o.name.toLowerCase()&&num(f.cal)===num(o.cal)))return; S.favorites.unshift({id:uid(),name:o.name,cal:num(o.cal),protein:num(o.protein),meal:o.meal}); if(S.favorites.length>40)S.favorites.pop(); save(); }
function delEntry(id){
  const d=day(curDate); const i=d.entries.findIndex(e=>e.id===id); if(i<0)return;
  const [removed]=d.entries.splice(i,1); save(); renderToday();
  showUndo("Entry deleted",()=>{ day(curDate).entries.splice(Math.min(i,day(curDate).entries.length),0,removed); save(); renderToday(); });
}

/* ============================ Barcode scanning ============================ */
let scanStream=null, scanRAF=null, scanReader=null, scanDetector=null;
async function startScan(meal){
  const host=$("#scanHost"), stat=$("#scanStat");
  stat.textContent="Starting camera…"; stat.dataset.state="";
  host.innerHTML=`<div id="scanView"><video id="scanVid" playsinline muted autoplay></video><div class="scanline"></div></div>
    <div class="btnrow"><button class="btn outline wide" id="scanStop">Stop scanning</button></div>`;
  $("#scanStop").onclick=stopScan;
  try{
    scanStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"environment"}});
    const vid=$("#scanVid"); vid.srcObject=scanStream; await vid.play();
    if("BarcodeDetector" in window){
      scanDetector=new window.BarcodeDetector({formats:["ean_13","ean_8","upc_a","upc_e","code_128"]});
      const loop=async()=>{ if(!scanStream)return; try{ const codes=await scanDetector.detect(vid); if(codes&&codes.length){ onCode(codes[0].rawValue,meal); return; } }catch(e){} scanRAF=requestAnimationFrame(loop); };
      loop();
    }else{
      stat.textContent="Loading scanner…";
      await loadZXing();
      scanReader=new window.ZXingBrowser.BrowserMultiFormatReader();
      scanReader.decodeFromVideoElement(vid,(res,err)=>{ if(res){ onCode(res.getText(),meal); } });
    }
    stat.textContent="Point at a barcode…";
  }catch(e){ stat.textContent="Camera unavailable — enter it manually below."; stat.dataset.state="err"; stopScan(true); }
}
function stopScan(keepHost){
  if(scanRAF)cancelAnimationFrame(scanRAF); scanRAF=null;
  if(scanReader){ try{scanReader.reset();}catch(e){} scanReader=null; }
  if(scanStream){ scanStream.getTracks().forEach(t=>t.stop()); scanStream=null; }
  scanDetector=null; if(!keepHost&&$("#scanHost"))$("#scanHost").innerHTML="";
}
async function onCode(code,meal){
  stopScan(true); const stat=$("#scanStat"); $("#scanHost").innerHTML="";
  stat.textContent="Looking up "+code+"…"; stat.dataset.state="";
  try{
    const r=await fetch(`https://world.openfoodfacts.org/api/v2/product/${encodeURIComponent(code)}.json?fields=product_name,brands,nutriments,serving_size`);
    const j=await r.json();
    if(j.status!==1||!j.product){ stat.textContent="Not found — enter it manually."; stat.dataset.state="err"; return; }
    const p=j.product, n=p.nutriments||{};
    const name=[p.brands,p.product_name].filter(Boolean).join(" ").trim()||"Scanned food";
    const kcal100=num(n["energy-kcal_100g"]), prot100=num(n["proteins_100g"]);
    const kcalServ=num(n["energy-kcal_serving"]), protServ=num(n["proteins_serving"]);
    // prefer per-serving if available
    if(kcalServ){ $("#scanStat").textContent="Found ✓ — check the amount"; $("#scanStat").dataset.state="on";
      $("#fName").value=name; $("#fCal").value=Math.round(kcalServ); $("#fProt").value=protServ?round(protServ,1):""; }
    else if(kcal100){ $("#scanStat").textContent="Found ✓ — values per 100g, adjust if needed"; $("#scanStat").dataset.state="on";
      $("#fName").value=name+(p.serving_size?"":" (per 100g)"); $("#fCal").value=Math.round(kcal100); $("#fProt").value=prot100?round(prot100,1):""; }
    else{ $("#scanStat").textContent="Found "+name+" but no calorie data — enter manually."; $("#scanStat").dataset.state="err"; $("#fName").value=name; }
    $("#fFav").checked=true;
  }catch(e){ stat.textContent="Lookup failed (offline?) — enter manually."; stat.dataset.state="err"; }
}
function loadZXing(){ return new Promise((res,rej)=>{ if(window.ZXingBrowser)return res();
  const s=document.createElement("script"); s.src="https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/index.min.js"; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }

/* ============================ Weigh-in sheet ============================ */
function openWeighSheet(dateOverride){
  const arr=weighArr(); const last=arr.length?arr[arr.length-1].w:num(S.settings.goalWeight)||170;
  const d=dateOverride||todayStr();
  const cur=S.weights[d]?num(S.weights[d].w):last;
  $("#sheet").innerHTML=`<div class="grab"></div>
    <h2>⚖️ Weigh in</h2>
    <div class="tiny" style="margin-bottom:8px">${d===todayStr()?"Today":fmtD(d)}${S.weights[d]?" · editing":""}</div>
    <div style="display:flex;align-items:center;gap:12px;justify-content:center;margin:14px 0">
      <button class="btn outline" id="wMinus" style="width:56px;font-size:22px">−</button>
      <input class="inp" id="wVal" type="number" inputmode="decimal" step="0.1" value="${round(cur,1)}" style="text-align:center;font-size:30px;font-weight:800;width:150px">
      <button class="btn outline" id="wPlus" style="width:56px;font-size:22px">＋</button>
    </div>
    <div style="text-align:center;color:var(--on-surface-variant);margin-bottom:14px">lb · ± 0.2 per tap</div>
    <div class="btnrow"><button class="btn wide" id="wSave">Save weigh-in</button></div>`;
  openScrim();
  const inp=$("#wVal");
  $("#wMinus").onclick=()=>inp.value=round(num(inp.value)-0.2,1);
  $("#wPlus").onclick=()=>inp.value=round(num(inp.value)+0.2,1);
  $("#wSave").onclick=()=>{ const w=num(inp.value); if(w<=0){toast("Enter a weight");return;} S.weights[d]={w,ts:Date.now()}; save(); closeScrim(); toast("Weight saved"); if(view==="weight")renderWeight(); };
}
function delWeight(d){ const prev=S.weights[d]; delete S.weights[d]; save(); renderWeight(); showUndo("Weigh-in deleted",()=>{ S.weights[d]=prev; save(); renderWeight(); }); }

/* ============================ Backups & restore ============================ */
async function openBackups(){
  $("#sheet").innerHTML=`<div class="grab"></div><h2>🛟 Backups & restore</h2>
    <div class="tiny" style="margin-bottom:10px">Dated snapshots kept in the cloud (30) and on this device (7). Restore replaces your current data.</div>
    <div class="btnrow"><button class="btn tonal" id="bakNow">Back up now</button></div>
    <div class="status" id="bakStat"></div>
    <div class="baklist" id="bakList" style="margin-top:8px"></div>`;
  openScrim();
  $("#bakNow").onclick=async()=>{ await doBackup(); $("#bakStat").textContent="Snapshot saved ✓"; $("#bakStat").dataset.state="on"; loadBakList(); };
  loadBakList();
}
async function loadBakList(){
  const el=$("#bakList"); if(!el)return; el.innerHTML=`<div class="empty">Loading…</div>`;
  let cloud={}; if(window.__tbCloud&&window.__tbCloud.connected){ try{cloud=await window.__tbCloud.backupList();}catch(e){} }
  let local={}; try{local=JSON.parse(localStorage.getItem("tabe_backups")||"{}");}catch(e){}
  const keys=[...new Set([...Object.keys(cloud),...Object.keys(local)])].sort().reverse();
  if(!keys.length){ el.innerHTML=`<div class="empty">No backups yet — tap “Back up now”.</div>`; return; }
  el.innerHTML=keys.map(k=>{ const where=cloud[k]?"☁︎ cloud":"📱 device";
    return `<div class="bakitem"><div class="bd"><b>${k}</b><div class="tiny">${where}</div></div>
      <button class="btn outline" data-restore="${k}" style="padding:8px 14px">Restore</button></div>`; }).join("");
  $$("[data-restore]").forEach(b=>b.onclick=()=>restoreBackup(b.dataset.restore,cloud,local));
}
async function doBackup(){
  const key=new Date().toISOString().slice(0,19).replace("T"," ");
  const snap=JSON.stringify(S);
  try{ const all=JSON.parse(localStorage.getItem("tabe_backups")||"{}"); all[key]=snap;
    const ks=Object.keys(all).sort(); while(ks.length>7){delete all[ks.shift()];}
    localStorage.setItem("tabe_backups",JSON.stringify(all)); }catch(e){}
  if(window.__tbCloud&&window.__tbCloud.connected){ try{await window.__tbCloud.backupSave(key.replace(/[:]/g,"-"),snap);}catch(e){} }
}
async function restoreBackup(k,cloud,local){
  if(!confirm("Restore snapshot from "+k+"? This replaces your current data."))return;
  let raw=local[k]||cloud[k];
  if(!raw&&window.__tbCloud){ try{raw=await window.__tbCloud.backupGet(k.replace(/[:]/g,"-"));}catch(e){} }
  if(!raw){toast("Couldn't load that backup");return;}
  try{ S=normalize(JSON.parse(raw)); save(); closeScrim(); render(); toast("Restored ✓"); }catch(e){toast("Restore failed");}
}

/* ============================ CSV export ============================ */
function download(name,text){ const b=new Blob([text],{type:"text/csv"}); const u=URL.createObjectURL(b);
  const a=document.createElement("a"); a.href=u; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(u),1000); }
function exportFood(){
  let rows=[["date","meal","food","calories","protein_g"]];
  Object.keys(S.days).sort().forEach(d=>{ (S.days[d].entries||[]).forEach(e=>rows.push([d,e.meal,csv(e.name),Math.round(num(e.cal)),round(num(e.protein),1)])); });
  download("tabe-food.csv",rows.map(r=>r.join(",")).join("\n")); toast("Food CSV exported");
}
function exportWeight(){
  let rows=[["date","weight_lb"]];
  Object.keys(S.weights).sort().forEach(d=>rows.push([d,round(num(S.weights[d].w),1)]));
  download("tabe-weight.csv",rows.map(r=>r.join(",")).join("\n")); toast("Weight CSV exported");
}
const csv=s=>`"${String(s||"").replace(/"/g,'""')}"`;

/* ============================ misc UI ============================ */
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function openScrim(){ $("#scrim").classList.add("open"); }
function closeScrim(){ $("#scrim").classList.remove("open"); stopScan(); }
$("#scrim").addEventListener("click",e=>{ if(e.target===$("#scrim")) closeScrim(); });
function toast(m){ showSnack(m,null); }
function showUndo(m,fn){ showSnack(m,fn); }
function showSnack(m,fn){
  clearTimeout(undoTimer); const s=$("#snack"); $("#snackMsg").textContent=m;
  const act=$("#snackAct"); act.style.display=fn?"block":"none"; act.onclick=fn?()=>{ fn(); s.classList.remove("show"); }:null;
  s.classList.add("show"); undoTimer=setTimeout(()=>s.classList.remove("show"),fn?5500:2600);
}
function toggleTheme(){ const cur=document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark";
  document.documentElement.setAttribute("data-theme",cur); try{localStorage.setItem("tabe_theme",cur);}catch(e){}
  $("#themeBtn").textContent=cur==="dark"?"☀":"☾"; $("#metaTheme")&&0; }
function reqReminder(){ if("Notification" in window&&Notification.permission==="default") Notification.requestPermission().catch(()=>{}); }

/* ---- events ---- */
$("#themeBtn").textContent=document.documentElement.getAttribute("data-theme")==="dark"?"☀":"☾";
$("#themeBtn").onclick=toggleTheme;
$("#fabWeigh").onclick=()=>openWeighSheet();
$$("nav.tabs button").forEach(b=>b.onclick=()=>{ view=b.dataset.tab; if(view==="today")curDate=todayStr(); render(); window.scrollTo(0,0); });
$("#dPrev").onclick=()=>{ curDate=addDays(curDate,-1); renderToday(); syncDateNav(); };
$("#dNext").onclick=()=>{ if(curDate<todayStr()){ curDate=addDays(curDate,1); renderToday(); syncDateNav(); } };
$("#dToday").onclick=()=>{ curDate=todayStr(); renderToday(); syncDateNav(); };

/* ---- boot ---- */
load();
if(getSyncKey()) { /* cloud module will auto-connect */ }
render();
// daily auto-backup once per day
try{ const lb=localStorage.getItem("tabe_lastbak")||""; if(lb!==todayStr()){ setTimeout(()=>{ doBackup(); localStorage.setItem("tabe_lastbak",todayStr()); },4000); } }catch(e){}
if("serviceWorker" in navigator){ addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{})); }
</script>

<!-- ============================ Firebase (bon-echo) — whole-state blob, newest-wins ============================ -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-app.js";
  import { getDatabase, ref, onValue, set, off, get, remove } from "https://www.gstatic.com/firebasejs/10.12.5/firebase-database.js";
  const cfg={apiKey:"AIzaSyD9AJbPC9M4gpTyvfIoRcqILq0ZOom1OBs",authDomain:"bon-echo-bd946.firebaseapp.com",databaseURL:"https://bon-echo-bd946-default-rtdb.firebaseio.com",projectId:"bon-echo-bd946",storageBucket:"bon-echo-bd946.firebasestorage.app",messagingSenderId:"196437731482",appId:"1:196437731482:web:3ac836962ce7d89e735723"};
  const status=(m,s)=>{ if(window.__tbCloudStatus) window.__tbCloudStatus(m,s); };
  const sanitize=k=>k.replace(/[.#$\[\]\/\s]+/g,"_").slice(0,64);
  try{
    const app=initializeApp(cfg); const db=getDatabase(app); let curRef=null, curKey="", lastSent="";
    window.__tbCloud={
      ready:true, connected:false,
      connect(key){ const safe=sanitize(key); if(!safe){status("Enter a key to turn on sync.","err");return;}
        if(curRef) off(curRef); curKey=safe; curRef=ref(db,"tabe/"+safe+"/blob"); this.connected=true; lastSent=""; status("Connecting…","");
        onValue(curRef, snap=>{ this.connected=true; const v=snap.val();
          if(v){ if(v===lastSent){ status("Synced ✓","on"); return; } lastSent=v;
            try{ if(window.__tbApplyRemote) window.__tbApplyRemote(JSON.parse(v)); }catch(e){}
            status("Synced ✓","on");
          }else{ status("Synced ✓","on"); const d=window.__tbData?window.__tbData():null; if(d) this.push(d); }
        }, err=>{ this.connected=false; status("Sync error — check Firebase rules.","err"); });
      },
      disconnect(){ if(curRef) off(curRef); curRef=null; curKey=""; this.connected=false; lastSent=""; status("Off — this device only.",""); },
      push(obj){ if(!curRef||!this.connected||!obj) return; const s=JSON.stringify(obj); if(s===lastSent) return; lastSent=s;
        set(curRef,s).catch(()=>status("Sync error — check Firebase rules.","err")); },
      async backupSave(day,snap){ if(!curKey||!snap) return; try{ await set(ref(db,"tabe/"+curKey+"/backups/"+day),snap);
        const s=await get(ref(db,"tabe/"+curKey+"/backups")); const v=s.val()||{}; const ks=Object.keys(v).sort();
        while(ks.length>30){ const k=ks.shift(); remove(ref(db,"tabe/"+curKey+"/backups/"+k)).catch(()=>{}); } }catch(e){} },
      backupList(){ if(!curKey) return Promise.resolve({}); return get(ref(db,"tabe/"+curKey+"/backups")).then(s=>{ const v=s.val()||{}; const o={}; Object.keys(v).forEach(k=>o[k.replace(/-/g,m=>m)]=v[k]); return v; }).catch(()=>({})); },
      backupGet(day){ if(!curKey) return Promise.resolve(null); return get(ref(db,"tabe/"+curKey+"/backups/"+day)).then(s=>s.val()).catch(()=>null); }
    };
    let saved=""; try{ saved=localStorage.getItem("tabe_synckey")||""; }catch(e){}
    if(saved) window.__tbCloud.connect(saved); else status("Off — this device only.","");
  }catch(e){ status("Cloud sync couldn't start.","err"); }
</script>
